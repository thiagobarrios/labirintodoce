<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Gerador de Níveis</title>
<style>
  body { 
    background: #f9f9f9; 
    text-align: center; 
    font-family: 'Segoe UI', Tahoma, sans-serif; 
    padding: 20px; 
    color: #333;
  }
  .grid { 
    display: inline-block; 
    background: #ecf0f1; 
    border: 2px solid #bdc3c7; 
    margin-bottom: 20px; 
    box-shadow: 0 4px 6px rgba(0,0,0,0.1);
  }
  .row { display: flex; }
  .cell { 
    width: 40px; 
    height: 40px; 
    border: 1px solid #ccc; 
    box-sizing: border-box; 
    cursor: pointer; 
    display: flex; 
    align-items: center; 
    justify-content: center; 
  }
  .cell:hover { opacity: 0.8; }
  .tools { margin-bottom: 20px; }
  button { 
    padding: 10px 15px; 
    margin: 0 5px; 
    cursor: pointer; 
    border: none; 
    border-radius: 4px; 
    font-weight: bold; 
    transition: 0.2s;
  }
  button:active { transform: scale(0.95); }
  
  /* Cores das ferramentas */
  .btn-chao { background: #ecf0f1; color: #333; border: 1px solid #ccc; }
  .btn-parede { background: #d4495e; color: white; }
  .btn-alvo { background: #2ecc71; color: white; }
  .btn-doce { background: #a74c3c; color: white; }
  .btn-jogador { background: #070c3c; color: white; }
  
  /* Novos botões de limpeza */
  .btn-limpar { background: #f39c12; color: white; margin-left: 15px; }
  .btn-limpar-tudo { background: #c0392b; color: white; margin-left: 15px; }
  
  .active { outline: 3px solid #f1c40f; transform: scale(1.05); }
  
  textarea { 
    width: 80%; 
    height: 150px; 
    font-family: monospace; 
    padding: 10px; 
    border-radius: 5px;
    border: 1px solid #bdc3c7;
    font-size: 14px;
  }
  
  /* Representação visual na paleta e no grid */
  .v-parede { background: #d4495e; width: 100%; height: 100%; }
  .v-alvo { background: #2ecc71; border-radius: 50%; width: 20px; height: 20px; }
  .v-doce { background: #a74c3c; border-radius: 50%; width: 30px; height: 30px; }
  .v-jogador { background: #070c3c; border-radius: 50%; width: 30px; height: 30px; }
</style>
</head>
<body>
<h2>Construtor de Níveis (Matriz 2D)</h2>
<p>Selecione uma ferramenta e desenhe no grid para mapear a fase.</p>

<div class="tools">
  <button class="tool-btn btn-chao active" data-val="0">Chão (0)</button>
  <button class="tool-btn btn-parede" data-val="1">Parede (1)</button>
  <button class="tool-btn btn-alvo" data-val="2">Alvo (2)</button>
  <button class="tool-btn btn-doce" data-val="3">Doce (3)</button>
  <button class="tool-btn btn-jogador" data-val="4">Jogador (4)</button>
  
  <!-- Ferramenta Borracha (Mesmo valor do chão: 0) -->
  <button class="tool-btn btn-limpar" data-val="0">Borracha</button>
</div>

<div style="margin-bottom: 20px;">
  Colunas: <input type="number" id="width" value="8" min="3" max="20" style="width:50px; padding:5px;">
  Linhas: <input type="number" id="height" value="8" min="3" max="20" style="width:50px; padding:5px;">
  <button onclick="createGrid()" style="background:#3498db; color:white;">Redimensionar Matriz</button>
  
  <!-- Botão Limpar Tudo -->
  <button onclick="clearAll()" class="btn-limpar-tudo">Limpar Tudo</button>
</div>

<div id="grid-container" class="grid"></div>
<br>
<button onclick="generateCode()" style="background:#2ecc71; color:white; padding: 15px 30px; font-size:16px;">Exportar Matriz do Mapa</button>
<br><br>
<textarea id="output" readonly placeholder="O array javascript aparecerá aqui para ser copiado..."></textarea>

<script>
  let currentTool = 0;
  let mapData = [];

  // Lógica de seleção das ferramentas
  document.querySelectorAll('.tool-btn').forEach(btn => {
    btn.addEventListener('click', (e) => {
      document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));
      e.target.classList.add('active');
      currentTool = parseInt(e.target.getAttribute('data-val'));
    });
  });

  function createGrid() {
    const w = parseInt(document.getElementById('width').value);
    const h = parseInt(document.getElementById('height').value);
    const container = document.getElementById('grid-container');
    container.innerHTML = '';
    mapData = [];

    for (let y = 0; y < h; y++) {
      let rowData = [];
      const rowDiv = document.createElement('div');
      rowDiv.className = 'row';
      
      for (let x = 0; x < w; x++) {
        rowData.push(0); // 0 é o padrão (vazio/chão)
        const cell = document.createElement('div');
        cell.className = 'cell';
        cell.dataset.x = x;
        cell.dataset.y = y;
        
        // Pinta ao clicar ou arrastar
        cell.addEventListener('mousedown', applyTool);
        cell.addEventListener('mouseenter', (e) => {
          if(e.buttons === 1) applyTool(e);
        });

        rowDiv.appendChild(cell);
      }
      mapData.push(rowData);
      container.appendChild(rowDiv);
    }
  }

  function applyTool(e) {
    const x = parseInt(e.target.dataset.x);
    const y = parseInt(e.target.dataset.y);
    
    // Regra: Só um jogador é permitido na matriz
    if(currentTool === 4) {
       for(let i=0; i<mapData.length; i++){
         for(let j=0; j<mapData[i].length; j++){
           if(mapData[i][j] === 4) {
             mapData[i][j] = 0;
             updateCellVisual(j, i);
           }
         }
       }
    }

    mapData[y][x] = currentTool;
    updateCellVisual(x, y);
  }

  function updateCellVisual(x, y) {
    const val = mapData[y][x];
    const cell = document.querySelector(`.cell[data-x="${x}"][data-y="${y}"]`);
    cell.innerHTML = ''; // Limpa a célula primeiro
    
    // Adiciona o elemento visual correspondente
    if(val === 1) cell.innerHTML = '<div class="v-parede"></div>';
    if(val === 2) cell.innerHTML = '<div class="v-alvo"></div>';
    if(val === 3) cell.innerHTML = '<div class="v-doce"></div>';
    if(val === 4) cell.innerHTML = '<div class="v-jogador"></div>';
  }

  // Função para limpar o mapa inteiro
  function clearAll() {
    if(confirm("Tem certeza que deseja apagar todo o mapa?")) {
      for(let y=0; y<mapData.length; y++){
        for(let x=0; x<mapData[y].length; x++){
          mapData[y][x] = 0;
          updateCellVisual(x, y);
        }
      }
    }
  }

  function generateCode() {
    let hasPlayer = false;
    let targets = 0;
    let candies = 0;

    let code = "let map = [\n";
    for(let y=0; y<mapData.length; y++){
      code += "  [" + mapData[y].join(",") + "]";
      if(y < mapData.length - 1) code += ",\n";
      else code += "\n";

      for(let x=0; x<mapData[y].length; x++){
         if(mapData[y][x] === 4) hasPlayer = true;
         if(mapData[y][x] === 2) targets++;
         if(mapData[y][x] === 3) candies++;
      }
    }
    code += "];";
    
    document.getElementById('output').value = code;

    // Validações lógicas
    if(!hasPlayer) alert("Atenção: A matriz não possui o bloco do Jogador (4)!");
    else if(targets !== candies) alert(`Aviso de Balanceamento: ${targets} Alvos vs ${candies} Doces.`);
  }

  // Inicia o grid na primeira carga
  createGrid();
</script>
</body>
</html>
